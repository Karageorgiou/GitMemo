name: Apply Index v2 Contract Patch

on:
  push:
    branches:
      - feat/index-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          python scripts/patch_index_v2_contract.py
          gofmt -w internal/indexer/indexer.go internal/starter/init.go

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MEMORY_PROTOCOL.md docs/REPOSITORY_VALIDATION.md internal/indexer/indexer.go internal/starter/init.go
          if git diff --cached --quiet; then
            echo "No patch changes."
          else
            git commit -m "docs: integrate Index v2 retrieval and freshness protocol"
            git push
          fi
