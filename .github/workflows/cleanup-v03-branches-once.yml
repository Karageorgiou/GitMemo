name: Clean v0.3 Working Branches Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged working branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/feat/v0.3-trust-foundation"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/fix/immutable-release-publish"
