name: Validate Runethread

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module content
        run: go mod verify

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t GOFILES < <(git ls-files '*.go')
          UNFORMATTED="$(gofmt -l "${GOFILES[@]}")"
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt required for:" >&2
            printf '%s\n' "$UNFORMATTED" >&2
            exit 1
          fi

      - name: Check patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA"...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root HEAD
          fi

      - name: Test development policy guard
        run: |
          python3 -m py_compile scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 scripts/check_development_policy_test.py

      - name: Enforce development policy
        run: python3 scripts/check_development_policy.py

      - name: Test PR impact guard
        run: |
          python3 -m py_compile scripts/check-pr-impact.py scripts/check_pr_impact_test.py
          python3 scripts/check_pr_impact_test.py

      - name: Validate PR impact/versioning invariants
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-pr-impact.py "$BASE_SHA"

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race detector
        run: go test -race -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Runethread CLI
        run: go build -o bin/runethread ./cmd/runethread

      - name: Initialize clean memory repository
        run: |
          rm -rf "$RUNNER_TEMP/runethread-memory"
          ./bin/runethread init "$RUNNER_TEMP/runethread-memory"

      - name: Check generated memory indexes
        run: ./bin/runethread index --check "$RUNNER_TEMP/runethread-memory"

      - name: Validate generated memory repository
        run: ./bin/runethread validate "$RUNNER_TEMP/runethread-memory"

  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module content
        run: go mod verify

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Runethread CLI
        run: go build ./cmd/runethread

  validate:
    name: validate
    if: always()
    needs: [quality, platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$PLATFORM_RESULT" = "success"
