name: Validate Runethread

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Runethread CLI
        run: go build -o bin/runethread ./cmd/runethread

      - name: Initialize clean memory repository
        run: |
          rm -rf "$RUNNER_TEMP/runethread-memory"
          ./bin/runethread init "$RUNNER_TEMP/runethread-memory"

      - name: Check generated memory indexes
        run: ./bin/runethread index --check "$RUNNER_TEMP/runethread-memory"

      - name: Validate generated memory repository
        run: ./bin/runethread validate "$RUNNER_TEMP/runethread-memory"
