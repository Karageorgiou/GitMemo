name: Validate Runethread

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module content
        run: go mod verify

      - name: Test PR impact guard
        run: |
          python3 -m py_compile scripts/check-pr-impact.py scripts/check_pr_impact_test.py
          python3 scripts/check_pr_impact_test.py

      - name: Validate PR impact/versioning invariants
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-pr-impact.py "$BASE_SHA"

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Runethread CLI
        run: go build -o bin/runethread ./cmd/runethread

      - name: Initialize clean memory repository
        run: |
          rm -rf "$RUNNER_TEMP/runethread-memory"
          ./bin/runethread init "$RUNNER_TEMP/runethread-memory"

      - name: Check generated memory indexes
        run: ./bin/runethread index --check "$RUNNER_TEMP/runethread-memory"

      - name: Validate generated memory repository
        run: ./bin/runethread validate "$RUNNER_TEMP/runethread-memory"
