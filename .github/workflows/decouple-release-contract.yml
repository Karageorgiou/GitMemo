name: Verify runtime and contract release decoupling

on:
  push:
    branches:
      - runethread/decouple-runtime-contract-release

permissions:
  contents: write

jobs:
  decouple:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact compatibility branch
        uses: actions/checkout@v7
        with:
          ref: runethread/decouple-runtime-contract-release
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Verify exact source state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "34adf579c6b3dcb40359fde7bd1cb9f69cd08ec7"
          test "$(git merge-base HEAD origin/main)" = "34adf579c6b3dcb40359fde7bd1cb9f69cd08ec7"
          expected=$'.github/scripts/decouple-release-contract.py\n.github/workflows/decouple-release-contract.yml'
          test "$(git diff --name-only origin/main...HEAD | sort)" = "$expected"

      - name: Apply exact compatibility patch
        run: python3 .github/scripts/decouple-release-contract.py

      - name: Format Go changes
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            internal/buildinfo/version.go \
            internal/trust/lock.go \
            internal/upgrader/native_previous.go \
            internal/upgrader/upgrader.go \
            internal/upgrader/upgrader_test.go \
            internal/upgrader/release_compatibility_test.go \
            internal/trust/release_compatibility_test.go

      - name: Enforce decoupling source invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-string 'RunethreadVersion: buildinfo.ReleaseVersion' internal; then
            echo 'metadata generation still binds repository pin to runtime ReleaseVersion' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-string 'cfg.RunethreadVersion != buildinfo.ReleaseVersion' internal; then
            echo 'native compatibility still binds repository pin to runtime ReleaseVersion' >&2
            exit 1
          fi
          test "$(grep -R --fixed-string 'ContractReleaseVersion' internal/buildinfo/version.go internal/trust internal/starter internal/upgrader | wc -l)" -ge 5

      - name: Verify no repository contract surface changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main -- . ':(exclude).github/scripts/decouple-release-contract.py' ':(exclude).github/workflows/decouple-release-contract.yml')"
          for forbidden in \
            MEMORY_PROTOCOL.md \
            docs/EXTENDING_RUNETHREAD.md \
            docs/INDEX_FORMAT.md \
            docs/MEMORY_CONTENT_FORMAT.md \
            docs/MEMORY_SCHEMA.md \
            docs/REPOSITORY_VALIDATION.md \
            docs/SOURCES.md \
            docs/TAXONOMY.md \
            docs/TRUST_MODEL.md \
            docs/USER_COMMANDS.md \
            schema/memory-item.schema.json \
            templates/correction.md \
            templates/decision.md \
            templates/fact.md \
            templates/milestone.md \
            templates/open_loop.md \
            templates/preference.md \
            templates/reference.md \
            templates/state.md; do
            if printf '%s\n' "$changed" | grep -Fx "$forbidden"; then
              echo "control-plane file changed unexpectedly: $forbidden" >&2
              exit 1
            fi
          done

      - name: Run full source gate
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go build ./cmd/runethread
          tmp="$(mktemp -d)"
          ./runethread init "$tmp/memory"
          ./runethread validate "$tmp/memory"
          ./runethread index --check "$tmp/memory"
          test "$(./runethread trust version "$tmp/memory")" = "v0.7.0"
          rm -rf "$tmp" ./runethread

      - name: Commit verified compatibility change
        shell: bash
        run: |
          set -euo pipefail
          git add \
            internal/buildinfo/version.go \
            internal/trust/lock.go \
            internal/trust/release_compatibility_test.go \
            internal/starter/init.go \
            internal/upgrader/native_previous.go \
            internal/upgrader/upgrader.go \
            internal/upgrader/upgrader_test.go \
            internal/upgrader/release_compatibility_test.go \
            docs/runethread/MEMORY_SERVICE.md \
            docs/adr/README.md \
            docs/adr/ADR-011-runtime-contract-release-separation.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: decouple runtime and contract releases'
          git push origin HEAD:runethread/decouple-runtime-contract-release
