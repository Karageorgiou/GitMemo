name: Audit runtime and contract release separation

on:
  push:
    branches:
      - runethread/decouple-runtime-contract-release

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compatibility branch
        uses: actions/checkout@v7
        with:
          ref: runethread/decouple-runtime-contract-release
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Audit every release-dimension reference
        shell: bash
        run: |
          set -euo pipefail
          echo '=== buildinfo release references ==='
          grep -R --line-number -E 'buildinfo\.(ReleaseVersion|ContractReleaseVersion)' internal cmd || true
          echo '=== repository pin references ==='
          grep -R --line-number -E 'RunethreadVersion|runethread_version' internal cmd || true
          echo '=== buildinfo constants ==='
          cat internal/buildinfo/version.go

      - name: Verify immutable base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "34adf579c6b3dcb40359fde7bd1cb9f69cd08ec7"
          test "$(git merge-base HEAD origin/main)" = "34adf579c6b3dcb40359fde7bd1cb9f69cd08ec7"

      - name: Run full source gate on current committed state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          go test ./...
          go vet ./...
          go build ./cmd/runethread
          rm -f ./runethread
          test -z "$(git status --porcelain)"
