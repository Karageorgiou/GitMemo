name: Finalize runtime and contract release separation

on:
  push:
    branches:
      - runethread/decouple-runtime-contract-release

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out compatibility branch
        uses: actions/checkout@v7
        with:
          ref: runethread/decouple-runtime-contract-release
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Verify immutable base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "34adf579c6b3dcb40359fde7bd1cb9f69cd08ec7"
          test "$(git merge-base HEAD origin/main)" = "34adf579c6b3dcb40359fde7bd1cb9f69cd08ec7"
          test -z "$(git status --porcelain)"

      - name: Repair contract-facing test expectations
        run: python3 .github/scripts/decouple-release-contract.py

      - name: Format repaired tests
        run: gofmt -w internal/starter/init_test.go internal/trust/lock_test.go internal/upgrader/upgrader_test.go

      - name: Enforce test/runtime separation
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-string 'buildinfo.ReleaseVersion' \
            internal/starter/init_test.go \
            internal/trust/lock_test.go \
            internal/upgrader/upgrader_test.go; then
            echo 'contract-facing test still depends on runtime ReleaseVersion' >&2
            exit 1
          fi
          grep -R --line-number --fixed-string 'buildinfo.ContractReleaseVersion' \
            internal/starter/init_test.go \
            internal/trust/lock_test.go \
            internal/upgrader/upgrader_test.go

      - name: Run full source gate
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go build ./cmd/runethread
          rm -f ./runethread

      - name: Commit only repaired tests
        shell: bash
        run: |
          set -euo pipefail
          git add internal/starter/init_test.go internal/trust/lock_test.go internal/upgrader/upgrader_test.go
          cat > /tmp/expected <<'EOF'
          internal/starter/init_test.go
          internal/trust/lock_test.go
          internal/upgrader/upgrader_test.go
          EOF
          git diff --cached --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: pin repository fixtures to contract release'
          git push origin HEAD:runethread/decouple-runtime-contract-release
