name: Verify committed runtime and contract release separation

on:
  push:
    branches:
      - runethread/decouple-runtime-contract-release

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compatibility branch
        uses: actions/checkout@v7
        with:
          ref: runethread/decouple-runtime-contract-release
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Verify exact base and intended branch surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "34adf579c6b3dcb40359fde7bd1cb9f69cd08ec7"
          test "$(git merge-base HEAD origin/main)" = "34adf579c6b3dcb40359fde7bd1cb9f69cd08ec7"
          cat > /tmp/expected-files <<'EOF'
          .github/scripts/decouple-release-contract.py
          .github/workflows/decouple-release-contract.yml
          docs/adr/ADR-011-runtime-contract-release-separation.md
          docs/adr/README.md
          docs/runethread/MEMORY_SERVICE.md
          internal/buildinfo/version.go
          internal/starter/init.go
          internal/starter/init_test.go
          internal/trust/lock.go
          internal/trust/lock_test.go
          internal/trust/release_compatibility_test.go
          internal/upgrader/native_previous.go
          internal/upgrader/release_compatibility_test.go
          internal/upgrader/upgrader.go
          internal/upgrader/upgrader_test.go
          EOF
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Enforce runtime-only ReleaseVersion usage
        shell: bash
        run: |
          set -euo pipefail
          grep -R --line-number --fixed-string 'buildinfo.ReleaseVersion' internal cmd > /tmp/runtime-refs
          cat /tmp/runtime-refs
          test "$(wc -l < /tmp/runtime-refs)" -eq 6
          cut -d: -f1 /tmp/runtime-refs | sort -u > /tmp/runtime-files
          cat > /tmp/expected-runtime-files <<'EOF'
          cmd/runethread/main.go
          internal/memoryservice/service.go
          internal/trust/lock.go
          internal/upgrader/upgrader.go
          EOF
          diff -u /tmp/expected-runtime-files /tmp/runtime-files
          if grep -R --line-number --fixed-string 'buildinfo.ReleaseVersion' --include='*_test.go' .; then
            echo 'test expectation still binds repository semantics to runtime ReleaseVersion' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-string 'RunethreadVersion: buildinfo.ReleaseVersion' internal; then
            echo 'metadata generation still binds repository pin to runtime ReleaseVersion' >&2
            exit 1
          fi

      - name: Verify contract-release ownership points
        shell: bash
        run: |
          set -euo pipefail
          grep -R --line-number --fixed-string 'buildinfo.ContractReleaseVersion' internal | tee /tmp/contract-refs
          test "$(wc -l < /tmp/contract-refs)" -ge 12
          grep -F 'ContractReleaseVersion' internal/buildinfo/version.go
          grep -F 'RunethreadVersion: buildinfo.ContractReleaseVersion' internal/starter/init.go
          grep -F 'RunethreadVersion: buildinfo.ContractReleaseVersion' internal/trust/lock.go
          grep -F 'ToVersion:      buildinfo.ContractReleaseVersion' internal/upgrader/upgrader.go
          grep -F 'checkNativeCompatibilityFor(cfg, buildinfo.ReleaseVersion, buildinfo.ContractReleaseVersion)' internal/upgrader/upgrader.go
          grep -F 'checkNativeCompatibilityFor(cfg, "v0.8.0", "v0.7.0")' internal/upgrader/release_compatibility_test.go

      - name: Verify no repository contract surface changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD)"
          for forbidden in \
            MEMORY_PROTOCOL.md \
            docs/EXTENDING_RUNETHREAD.md \
            docs/INDEX_FORMAT.md \
            docs/MEMORY_CONTENT_FORMAT.md \
            docs/MEMORY_SCHEMA.md \
            docs/REPOSITORY_VALIDATION.md \
            docs/SOURCES.md \
            docs/TAXONOMY.md \
            docs/TRUST_MODEL.md \
            docs/USER_COMMANDS.md \
            schema/memory-item.schema.json \
            templates/correction.md \
            templates/decision.md \
            templates/fact.md \
            templates/milestone.md \
            templates/open_loop.md \
            templates/preference.md \
            templates/reference.md \
            templates/state.md; do
            if printf '%s\n' "$changed" | grep -Fx "$forbidden"; then
              echo "control-plane file changed unexpectedly: $forbidden" >&2
              exit 1
            fi
          done

      - name: Run full source and clean-init gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          go test ./...
          go vet ./...
          go build ./cmd/runethread
          tmp="$(mktemp -d)"
          ./runethread init "$tmp/memory"
          ./runethread validate "$tmp/memory"
          ./runethread index --check "$tmp/memory"
          test "$(./runethread trust version "$tmp/memory")" = "v0.7.0"
          rm -rf "$tmp" ./runethread
          test -z "$(git status --porcelain)"
