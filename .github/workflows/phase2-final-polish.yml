name: Phase 2 final polish

on:
  push:
    branches:
      - runethread/phase-2-memory-service

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: runethread/phase-2-memory-service
          fetch-depth: 0

      - name: Apply exact final service polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service = Path('internal/memoryservice/service.go')
          text = service.read_text()
          text = text.replace('\t"strings"\n', '\t"strings"\n\t"sync"\n', 1)
          old = 'type Service struct {\n\troot string\n\trepo repository.Reader\n}'
          new = 'type Service struct {\n\troot    string\n\trepo    repository.Reader\n\twriteMu sync.Mutex\n}'
          if text.count(old) != 1:
              raise SystemExit('Service struct pattern not found exactly once')
          service.write_text(text.replace(old, new, 1))

          mutation = Path('internal/memoryservice/mutation.go')
          text = mutation.read_text()
          old = '''func (s *Service) ApplyMutation(ctx context.Context, request ApplyMutationRequest) (ApplyMutationResult, error) {
          \twriter, ok := s.repo.(repository.Writer)'''.replace('          \t', '\t')
          new = '''func (s *Service) ApplyMutation(ctx context.Context, request ApplyMutationRequest) (ApplyMutationResult, error) {
          \ts.writeMu.Lock()
          \tdefer s.writeMu.Unlock()

          \twriter, ok := s.repo.(repository.Writer)'''.replace('          \t', '\t')
          if text.count(old) != 1:
              raise SystemExit('ApplyMutation entry pattern not found exactly once')
          mutation.write_text(text.replace(old, new, 1))

          cli = Path('cmd/runethread/service_cli.go')
          text = cli.read_text()
          replacements = {
              'root := fs.String("root", ".", "Runethread repository root")\n\tif err := fs.Parse(args); err != nil {': 'root := fs.String("root", ".", "Runethread repository root")\n\t_ = fs.Bool("json", false, "emit machine-readable JSON (service commands are always JSON)")\n\tif err := fs.Parse(args); err != nil {',
              'root := fs.String("root", ".", "Runethread repository root")\n\trequestPath := fs.String("request", "-", "JSON request file, or - for stdin")': 'root := fs.String("root", ".", "Runethread repository root")\n\t_ = fs.Bool("json", false, "emit machine-readable JSON (service commands are always JSON)")\n\trequestPath := fs.String("request", "-", "JSON request file, or - for stdin")',
          }
          # First pattern occurs in get + status; second in prepare + apply + withdraw.
          if text.count(list(replacements.keys())[0]) != 2:
              raise SystemExit('expected two get/status flag blocks')
          if text.count(list(replacements.keys())[1]) != 3:
              raise SystemExit('expected three request flag blocks')
          text = text.replace(list(replacements.keys())[0], list(replacements.values())[0])
          text = text.replace(list(replacements.keys())[1], list(replacements.values())[1])
          cli.write_text(text)

          main = Path('cmd/runethread/main.go')
          text = main.read_text()
          text = text.replace('runethread get [--root DIR] <uuid>', 'runethread get [--root DIR] [--json] <uuid>')
          text = text.replace('runethread prepare [--root DIR] [--request FILE|-]', 'runethread prepare [--root DIR] [--json] [--request FILE|-]')
          text = text.replace('runethread apply [--root DIR] [--request FILE|-]', 'runethread apply [--root DIR] [--json] [--request FILE|-]')
          text = text.replace('runethread withdraw [--root DIR] [--request FILE|-]', 'runethread withdraw [--root DIR] [--json] [--request FILE|-]')
          text = text.replace('runethread status [--root DIR]', 'runethread status [--root DIR] [--json]')
          main.write_text(text)

          test = Path('cmd/runethread/service_cli_test.go')
          text = test.read_text()
          for command in ['prepare', 'status', 'apply', 'get', 'withdraw']:
              text = text.replace('{"'+command+'", "--root"', '{"'+command+'", "--json", "--root"')
          test.write_text(text)
          PY

          cat >> internal/memoryservice/mutation_test.go <<'EOF'

          func TestConcurrentAppliesFromSameRevisionSerializeAndRejectStaleWriter(t *testing.T) {
              svc, root, revision := makeGitServiceFixture(t)
              requests := []ApplyMutationRequest{
                  {
                      ExpectedRevision: revision,
                      IdempotencyKey:   "concurrent-a",
                      Operation:        "create",
                      MutationTime:     "2026-09-03T04:00:00Z",
                      Proposed:         decisionProposal(secondMemoryID, "Concurrent decision A", nil),
                  },
                  {
                      ExpectedRevision: revision,
                      IdempotencyKey:   "concurrent-b",
                      Operation:        "create",
                      MutationTime:     "2026-09-03T04:00:01Z",
                      Proposed:         decisionProposal(thirdMemoryID, "Concurrent decision B", nil),
                  },
              }
              type outcome struct {
                  result ApplyMutationResult
                  err    error
              }
              start := make(chan struct{})
              outcomes := make(chan outcome, len(requests))
              for _, request := range requests {
                  request := request
                  go func() {
                      <-start
                      result, err := svc.ApplyMutation(context.Background(), request)
                      outcomes <- outcome{result: result, err: err}
                  }()
              }
              close(start)

              applied := 0
              stale := 0
              for range requests {
                  outcome := <-outcomes
                  if outcome.err == nil {
                      if outcome.result.Status != "applied" {
                          t.Fatalf("successful concurrent result = %+v", outcome.result)
                      }
                      applied++
                      continue
                  }
                  var serviceErr *Error
                  if !errors.As(outcome.err, &serviceErr) || serviceErr.Code != CodeStaleRevision {
                      t.Fatalf("concurrent loser error = %v, want stale_revision", outcome.err)
                  }
                  stale++
              }
              if applied != 1 || stale != 1 {
                  t.Fatalf("concurrent outcomes: applied=%d stale=%d", applied, stale)
              }
              records, err := memory.LoadAll(root)
              if err != nil {
                  t.Fatal(err)
              }
              if len(records) != 2 {
                  t.Fatalf("memory count after concurrent apply = %d, want 2", len(records))
              }
              assertRepositoryHealthy(t, root)
          }
          EOF

          gofmt -w internal/memoryservice/service.go internal/memoryservice/mutation.go internal/memoryservice/mutation_test.go cmd/runethread/service_cli.go cmd/runethread/service_cli_test.go cmd/runethread/main.go

          git add internal/memoryservice/service.go internal/memoryservice/mutation.go internal/memoryservice/mutation_test.go cmd/runethread/service_cli.go cmd/runethread/service_cli_test.go cmd/runethread/main.go
          expected=$'cmd/runethread/main.go\ncmd/runethread/service_cli.go\ncmd/runethread/service_cli_test.go\ninternal/memoryservice/mutation.go\ninternal/memoryservice/mutation_test.go\ninternal/memoryservice/service.go'
          test "$(git diff --cached --name-only | sort)" = "$expected"

      - name: Verify full Core suite
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/runethread

      - name: Commit verified polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: serialize memory writes and support JSON CLI flag'
          git push origin HEAD:runethread/phase-2-memory-service
