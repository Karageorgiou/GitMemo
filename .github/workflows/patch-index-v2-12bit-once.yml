name: Patch Index v2 12-bit Sharding Once

on:
  push:
    branches:
      - feat/index-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply 12-bit UUID sharding
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'internal/indexer/machine.go',
              'const idShardPrefixCharacters = 2',
              'const idShardPrefixCharacters = 3',
          )
          replace_once(
              'internal/indexer/machine.go',
              'files["index/by-id/"+prefix+".json"] = data',
              '''path, err := idShardPath(prefix)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tfiles[path] = data''',
          )
          replace_once(
              'internal/indexer/machine.go',
              'ByID:             "index/by-id/<first-2-uuid-hex>.json",',
              'ByID:             "index/by-id/<first-2-uuid-hex>/<third-uuid-hex>.json",',
          )
          replace_once(
              'internal/indexer/machine.go',
              '''\treturn prefix, nil\n}\n\nfunc memorySourceDigest''',
              '''\treturn prefix, nil\n}\n\nfunc idShardPath(prefix string) (string, error) {\n\tif len(prefix) != idShardPrefixCharacters {\n\t\treturn "", fmt.Errorf("invalid ID shard prefix length %d: %q", len(prefix), prefix)\n\t}\n\treturn filepath.ToSlash(filepath.Join("index", "by-id", prefix[:2], prefix[2:]+".json")), nil\n}\n\nfunc memorySourceDigest''',
          )

          replace_once(
              'internal/indexer/query.go',
              '''\tif shard == nil {\n\t\tpath := filepath.Join(root, "index", "by-id", prefix+".json")\n\t\tdata, err := os.ReadFile(path)''',
              '''\tif shard == nil {\n\t\trel, err := idShardPath(prefix)\n\t\tif err != nil {\n\t\t\treturn indexEntry{}, false, err\n\t\t}\n\t\tpath := filepath.Join(root, filepath.FromSlash(rel))\n\t\tdata, err := os.ReadFile(path)''',
          )

          p = Path('internal/indexer/indexer_test.go')
          s = p.read_text()
          s = s.replace('"index/by-id/11.json",', '"index/by-id/11/1.json",')
          s = s.replace('"index/by-id/22.json",', '"index/by-id/22/2.json",')
          s = s.replace('r.Files["index/by-id/11.json"]', 'r.Files["index/by-id/11/1.json"]')
          marker = '''func TestOpenLoopsExcludeResolved(t *testing.T) {'''
          test = '''func TestIDShardPathUsesTwelveBitsAndNestedDirectories(t *testing.T) {\n\tif idShardPrefixCharacters != 3 {\n\t\tt.Fatalf("ID sharding must use 3 hex characters / 12 bits, got %d", idShardPrefixCharacters)\n\t}\n\tpath, err := idShardPath("9f2")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif path != "index/by-id/9f/2.json" {\n\t\tt.Fatalf("unexpected 12-bit shard path: %s", path)\n\t}\n}\n\n'''
          if marker not in s:
              raise SystemExit('indexer test insertion marker not found')
          p.write_text(s.replace(marker, test + marker, 1))

          p = Path('MEMORY_PROTOCOL.md')
          s = p.read_text()
          old = 'for a known full memory UUID, compute its first two hexadecimal characters and read only `index/by-id/<prefix>.json`;'
          new = 'for a known full memory UUID, use its first three hexadecimal characters and read only the nested 12-bit shard `index/by-id/<first-two>/<third>.json`;'
          if old not in s:
              raise SystemExit('MEMORY_PROTOCOL ID lookup wording not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/INDEX_FORMAT.md')
          s = p.read_text()
          s = s.replace('''├── by-id/\n│   ├── 00.json\n│   ├── 01.json\n│   └── ...''', '''├── by-id/\n│   ├── 00/\n│   │   ├── 0.json\n│   │   ├── 1.json\n│   │   └── ...\n│   ├── 01/\n│   └── ...''')
          s = s.replace('A UUID is assigned to an ID shard using the first two hexadecimal characters of the UUID:', 'A UUID is assigned to an ID shard using its first three hexadecimal characters (12 bits). The first two characters select a directory and the third selects the shard file:')
          s = s.replace('<uuid> -> index/by-id/<first-two-uuid-hex>.json', '<uuid> -> index/by-id/<first-two-uuid-hex>/<third-uuid-hex>.json')
          s = s.replace('At most 256 ID shard files are possible with the current two-hex-character prefix. A reader that already knows a UUID therefore opens one deterministic shard instead of scanning a repository-wide catalog.', 'At most 4096 ID shard files are possible with the current three-hex-character / 12-bit prefix, distributed beneath at most 256 first-level directories. A reader that already knows a UUID therefore opens one deterministic shard instead of scanning a repository-wide catalog.')
          s = s.replace('With respect to total repository size, lookup requires a constant number of shard-path calculations and file reads. Actual latency still depends on filesystem, Git provider, network, and shard size.', 'With respect to total repository size, lookup requires a constant number of shard-path calculations and file reads. At one million uniformly distributed UUIDv4 memories, the expected average is about 244 records per ID shard instead of about 3906 with an 8-bit/256-shard layout. Actual latency still depends on filesystem, Git provider, network, record size, and distribution.')
          p.write_text(s)
          PY

          gofmt -w internal/indexer/machine.go internal/indexer/query.go internal/indexer/indexer_test.go
          go test ./...
          go vet ./...

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/indexer/machine.go internal/indexer/query.go internal/indexer/indexer_test.go MEMORY_PROTOCOL.md docs/INDEX_FORMAT.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "perf: use 12-bit nested UUID index sharding"
            git push
          fi
