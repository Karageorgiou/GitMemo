name: Index v2 Scale Once

on:
  push:
    branches:
      - feat/index-v2

permissions:
  contents: read

jobs:
  scale:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run 10k scale test
        env:
          GITMEMO_SCALE_N: '10000'
        run: go test ./internal/indexer -run '^TestSyntheticScale$' -count=1 -v
      - name: Run 100k scale test
        env:
          GITMEMO_SCALE_N: '100000'
        run: go test ./internal/indexer -run '^TestSyntheticScale$' -count=1 -v
      - name: Run 1M scale test
        env:
          GITMEMO_SCALE_N: '1000000'
        run: go test ./internal/indexer -run '^TestSyntheticScale$' -count=1 -v
