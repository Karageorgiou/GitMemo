name: Release GitMemo

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify tag matches source version
        run: |
          TAG="${GITHUB_REF_NAME}"
          SOURCE_VERSION="$(go run ./cmd/gitmemo version)"
          if [ "$TAG" != "$SOURCE_VERSION" ]; then
            echo "release tag $TAG does not match source version $SOURCE_VERSION" >&2
            exit 1
          fi

      - name: Run release tests
        run: |
          go test ./...
          go vet ./...

      - name: Build and validate release CLI
        run: |
          mkdir -p dist
          go build -trimpath -o dist/gitmemo-linux-amd64 ./cmd/gitmemo
          ./dist/gitmemo version
          rm -rf "$RUNNER_TEMP/gitmemo-release-smoke"
          ./dist/gitmemo init "$RUNNER_TEMP/gitmemo-release-smoke"
          ./dist/gitmemo index --check "$RUNNER_TEMP/gitmemo-release-smoke"
          ./dist/gitmemo validate "$RUNNER_TEMP/gitmemo-release-smoke"

      - name: Build platform binaries
        env:
          CGO_ENABLED: '0'
        run: |
          build() {
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags='-s -w' -o "dist/$3" ./cmd/gitmemo
          }
          build linux amd64 gitmemo-linux-amd64
          build linux arm64 gitmemo-linux-arm64
          build darwin amd64 gitmemo-darwin-amd64
          build darwin arm64 gitmemo-darwin-arm64
          build windows amd64 gitmemo-windows-amd64.exe
          (
            cd dist
            sha256sum \
              gitmemo-linux-amd64 \
              gitmemo-linux-arm64 \
              gitmemo-darwin-amd64 \
              gitmemo-darwin-arm64 \
              gitmemo-windows-amd64.exe > SHA256SUMS.txt
          )

      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/gitmemo-linux-amd64 \
            dist/gitmemo-linux-arm64 \
            dist/gitmemo-darwin-amd64 \
            dist/gitmemo-darwin-arm64 \
            dist/gitmemo-windows-amd64.exe \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --draft \
            --title "GitMemo $GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
