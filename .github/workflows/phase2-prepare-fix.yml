name: Phase 2 prepare-operation fix

on:
  push:
    branches:
      - runethread/phase-2-memory-service

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: runethread/phase-2-memory-service
          fetch-depth: 0

      - name: Align prepare legal operations with apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/memoryservice/service.go')
          text = path.read_text()
          old = 'if candidate.Memory.Type == "open_loop" {\n\t\t\toperations["resolve"] = true\n\t\t}'
          new = 'if candidate.Memory.Type == "open_loop" && isUnresolvedOpenLoop(candidate.Memory.OpenLoopStatus) {\n\t\t\toperations["resolve"] = true\n\t\t}'
          if text.count(old) != 1:
              raise SystemExit('expected legalOperations block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          cat > internal/memoryservice/legal_operations_test.go <<'EOF'
          package memoryservice

          import (
              "slices"
              "testing"

              "github.com/runethread/core/internal/memory"
          )

          func TestLegalOperationsAdvertiseResolveOnlyForUnresolvedOpenLoops(t *testing.T) {
              cases := []struct {
                  name        string
                  status      string
                  wantResolve bool
              }{
                  {name: "open", status: "open", wantResolve: true},
                  {name: "blocked", status: "blocked", wantResolve: true},
                  {name: "deferred", status: "deferred", wantResolve: true},
                  {name: "resolved", status: "resolved", wantResolve: false},
                  {name: "cancelled", status: "cancelled", wantResolve: false},
              }
              for _, tc := range cases {
                  t.Run(tc.name, func(t *testing.T) {
                      status := tc.status
                      got := legalOperations([]Document{{Memory: memory.Memory{
                          Type:           "open_loop",
                          Lifecycle:      "active",
                          OpenLoopStatus: &status,
                      }}})
                      if slices.Contains(got, "resolve") != tc.wantResolve {
                          t.Fatalf("legal operations = %v, resolve presence want %v", got, tc.wantResolve)
                      }
                  })
              }
          }
          EOF
          gofmt -w internal/memoryservice/service.go internal/memoryservice/legal_operations_test.go
          test "$(git diff --name-only | sort)" = $'internal/memoryservice/legal_operations_test.go\ninternal/memoryservice/service.go'

      - name: Verify MemoryService
        run: go test ./internal/memoryservice

      - name: Commit verified alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/memoryservice/service.go internal/memoryservice/legal_operations_test.go
          git commit -m 'fix: align prepared legal operations with apply semantics'
          git push origin HEAD:runethread/phase-2-memory-service
